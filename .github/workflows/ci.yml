name: CI

# Automated PR/main CI is owned by Permanu CI in .permanu/workflows/permanu.yml.
# This workflow is an explicit manual fallback only, so hosted Actions minutes
# are not consumed for normal repository activity.
on:
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-flight runs for the same branch when a new commit lands.
# Prevents queued-run pile-up during active feature work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 1
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-validation:
    name: Rust Validation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.1'
          components: rustfmt, clippy
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: sh scripts/ci-rust.sh

  license-headers:
    name: License Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check license headers on Rust files
        run: |
          MISSING=0
          for file in $(find crates/ src/ -name '*.rs' 2>/dev/null); do
            if ! head -5 "$file" | grep -q "Business Source License"; then
              echo "MISSING LICENSE HEADER: $file"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo ""
            echo "Add this header to all .rs files:"
            echo "// Copyright (C) 2026 Permanu"
            echo "// SPDX-License-Identifier: BSL-1.1"
            exit 1
          fi
          echo "All files have license headers."

  deny:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Install cargo-deny from prebuilt binaries (~5s) instead of
      # compiling from source (~2-3min on cold runner). Doesn't need
      # the Rust toolchain at all.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
