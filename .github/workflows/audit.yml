name: Security Audit

# Automated dependency audit should run through Permanu CI when enabled for this
# repo. GitHub Actions stays manual-only to avoid background runner charges.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Install cargo-audit from prebuilt binaries (~5s) instead of
      # compiling from source (~2-3min). cargo-audit only inspects
      # Cargo.lock — it doesn't need the Rust toolchain.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run audit
        # Temporary advisory allowlist. Each ignored RUSTSEC must have a
        # matching tracking note/issue with the affected dependency, why it is
        # acceptable for now, and the removal condition. Do not add new ignores
        # without that rationale.
        run: >-
          cargo audit
          --ignore RUSTSEC-2025-0069
          --ignore RUSTSEC-2026-0098
          --ignore RUSTSEC-2026-0099
          --ignore RUSTSEC-2026-0114
          --ignore RUSTSEC-2024-0388
          --ignore RUSTSEC-2024-0384
          --ignore RUSTSEC-2024-0437
          --ignore RUSTSEC-2025-0134
          --ignore RUSTSEC-2025-0012
          --ignore RUSTSEC-2026-0097
