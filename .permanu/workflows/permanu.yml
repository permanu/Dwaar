name: Permanu CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rust-quality:
    name: Rust Quality
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Setup Rust
        shell: sh
        run: |
          current_run_dir="$(dirname "$(dirname "$PWD")")"
          find /tmp/permanu-ci -mindepth 1 -maxdepth 1 -type d ! -path "$current_run_dir" -exec rm -rf {} + 2>/dev/null || true
          export HOME="/root"
          export CARGO_HOME="/root/.cargo"
          export RUSTUP_HOME="/root/.rustup"
          export PATH="$CARGO_HOME/bin:$PATH"
          while ! mkdir /tmp/permanu-rustup.lock 2>/dev/null; do sleep 2; done
          trap 'rmdir /tmp/permanu-rustup.lock' EXIT
          if ! command -v cmake >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake pkg-config protobuf-compiler
          fi
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          . "$HOME/.cargo/env"
          rustup component add rustfmt clippy
          printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Format
        shell: sh
        run: cargo fmt --all --check

      - name: Lint
        shell: sh
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  rust-test:
    name: Rust Test
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Setup Rust
        shell: sh
        run: |
          current_run_dir="$(dirname "$(dirname "$PWD")")"
          find /tmp/permanu-ci -mindepth 1 -maxdepth 1 -type d ! -path "$current_run_dir" -exec rm -rf {} + 2>/dev/null || true
          export HOME="/root"
          export CARGO_HOME="/root/.cargo"
          export RUSTUP_HOME="/root/.rustup"
          export PATH="$CARGO_HOME/bin:$PATH"
          while ! mkdir /tmp/permanu-rustup.lock 2>/dev/null; do sleep 2; done
          trap 'rmdir /tmp/permanu-rustup.lock' EXIT
          if ! command -v cmake >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake pkg-config protobuf-compiler
          fi
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          . "$HOME/.cargo/env"
          printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Workspace tests
        shell: sh
        run: cargo test --workspace --exclude dwaar-cli

      - name: CLI tests
        shell: sh
        run: cargo test -p dwaar-cli --bins --test cli_integration

      - name: Ignored tests
        shell: sh
        run: cargo test --workspace --exclude dwaar-cli -- --ignored --nocapture

  rust-build:
    name: Rust Build
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Setup Rust
        shell: sh
        run: |
          current_run_dir="$(dirname "$(dirname "$PWD")")"
          find /tmp/permanu-ci -mindepth 1 -maxdepth 1 -type d ! -path "$current_run_dir" -exec rm -rf {} + 2>/dev/null || true
          export HOME="/root"
          export CARGO_HOME="/root/.cargo"
          export RUSTUP_HOME="/root/.rustup"
          export PATH="$CARGO_HOME/bin:$PATH"
          while ! mkdir /tmp/permanu-rustup.lock 2>/dev/null; do sleep 2; done
          trap 'rmdir /tmp/permanu-rustup.lock' EXIT
          if ! command -v cmake >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake pkg-config protobuf-compiler
          fi
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          . "$HOME/.cargo/env"
          printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build workspace
        shell: sh
        run: cargo build --workspace

      - name: Release type check
        shell: sh
        run: cargo check --workspace --release
