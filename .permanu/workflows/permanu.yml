name: Permanu CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      lane:
        description: Explicit CI lane to run manually.
        required: true
        type: choice
        default: pr
        options:
          - pr
          - main
          - release
          - all

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dwaar-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 1
  CARGO_INCREMENTAL: 0

jobs:
  version-guard:
    name: permanu-ci / dwaar / version-guard
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Check release version consistency
        shell: sh
        run: |
          chmod +x scripts/check-version-consistency.sh
          ./scripts/check-version-consistency.sh

  rust-validation:
    name: permanu-ci / dwaar / rust-validation
    needs: [version-guard, dependency-audit]
    runs-on: self-hosted
    container:
      image: rust:1.94.1-bookworm
      env:
        CARGO_HOME: /usr/local/cargo
        RUSTUP_HOME: /usr/local/rustup
        TMPDIR: /tmp
        TMP: /tmp
        TEMP: /tmp
        PATH: /usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    timeout-minutes: 90
    steps:
      - name: Prepare Rust runner once
        shell: sh
        run: |
          PERMANU_RUST_MODE=quality
          export PERMANU_RUST_MODE
          . ./scripts/permanu-ci-rust-env.sh
          if command -v apt-get >/dev/null 2>&1; then
            if ! command -v cmake >/dev/null 2>&1 || ! command -v protoc >/dev/null 2>&1 || ! command -v pkg-config >/dev/null 2>&1 || ! command -v cc >/dev/null 2>&1; then
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake pkg-config protobuf-compiler
            fi
          fi
      - name: Format, lint, test, and release check
        shell: sh
        run: sh scripts/ci-rust.sh

  dependency-audit:
    name: permanu-ci / dwaar / dependency-audit
    needs: version-guard
    runs-on: self-hosted
    container:
      image: rust:1.94.1-bookworm
      env:
        CARGO_HOME: /usr/local/cargo
        RUSTUP_HOME: /usr/local/rustup
        TMPDIR: /tmp
        TMP: /tmp
        TEMP: /tmp
        PATH: /usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    timeout-minutes: 30
    steps:
      - name: Run dependency audit
        shell: sh
        run: |
          chmod +x scripts/permanu-ci-rust-env.sh
          PERMANU_RUST_MODE=audit
          export PERMANU_RUST_MODE
          . ./scripts/permanu-ci-rust-env.sh
          unset PERMANU_RUST_MODE
          cargo audit \
            --ignore RUSTSEC-2025-0069 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0114 \
            --ignore RUSTSEC-2024-0388 \
            --ignore RUSTSEC-2024-0384 \
            --ignore RUSTSEC-2024-0437 \
            --ignore RUSTSEC-2025-0134 \
            --ignore RUSTSEC-2025-0012 \
            --ignore RUSTSEC-2026-0097
