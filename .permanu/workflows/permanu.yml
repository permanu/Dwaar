name: Permanu CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      lane:
        description: Explicit CI lane to run manually.
        required: true
        type: choice
        default: pr
        options:
          - pr
          - main
          - release
          - all

permissions:
  contents: write
  checks: write
  statuses: write
  pull-requests: read
  id-token: write

concurrency:
  group: dwaar-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-guard:
    name: permanu-ci / dwaar / version-guard
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'pr' || inputs.lane == 'main' || inputs.lane == 'release' || inputs.lane == 'all')) }}
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Check release version consistency
        shell: sh
        run: |
          chmod +x scripts/check-version-consistency.sh
          ./scripts/check-version-consistency.sh

  rust-quality:
    name: permanu-ci / dwaar / rust-quality
    needs: version-guard
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'pr' || inputs.lane == 'main' || inputs.lane == 'release' || inputs.lane == 'all')) }}
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Setup Rust
        shell: sh
        run: |
          export HOME="$PWD/.permanu-home"
          export CARGO_HOME="$PWD/.permanu-cargo"
          export RUSTUP_HOME="$PWD/.permanu-rustup"
          export PATH="$CARGO_HOME/bin:$PATH"
          mkdir -p "$HOME" "$CARGO_HOME" "$RUSTUP_HOME"
          lock=/tmp/permanu-rustup.lock
          waited=0
          while ! mkdir "$lock" 2>/dev/null; do
            if find "$lock" -maxdepth 0 -mmin +10 >/dev/null 2>&1; then
              rm -rf "$lock"
              continue
            fi
            waited=$((waited + 2))
            if [ "$waited" -gt 300 ]; then
              echo "timed out waiting for rustup lock"
              exit 1
            fi
            sleep 2
          done
          trap 'rm -rf "$lock"' EXIT
          if ! command -v cmake >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake pkg-config protobuf-compiler
          fi
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          if [ -f "$CARGO_HOME/env" ]; then
            . "$CARGO_HOME/env"
          fi
          if command -v rustup >/dev/null 2>&1; then
            rustup component add rustfmt clippy
          fi
          printf '%s\n' "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Format
        shell: sh
        run: cargo fmt --all --check

      - name: Lint
        shell: sh
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  rust-test:
    name: permanu-ci / dwaar / rust-test
    needs: version-guard
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'pr' || inputs.lane == 'main' || inputs.lane == 'release' || inputs.lane == 'all')) }}
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Setup Rust
        shell: sh
        run: |
          export HOME="$PWD/.permanu-home"
          export CARGO_HOME="$PWD/.permanu-cargo"
          export RUSTUP_HOME="$PWD/.permanu-rustup"
          export PATH="$CARGO_HOME/bin:$PATH"
          mkdir -p "$HOME" "$CARGO_HOME" "$RUSTUP_HOME"
          lock=/tmp/permanu-rustup.lock
          waited=0
          while ! mkdir "$lock" 2>/dev/null; do
            if find "$lock" -maxdepth 0 -mmin +10 >/dev/null 2>&1; then
              rm -rf "$lock"
              continue
            fi
            waited=$((waited + 2))
            if [ "$waited" -gt 300 ]; then
              echo "timed out waiting for rustup lock"
              exit 1
            fi
            sleep 2
          done
          trap 'rm -rf "$lock"' EXIT
          if ! command -v cmake >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake pkg-config protobuf-compiler
          fi
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          if [ -f "$CARGO_HOME/env" ]; then
            . "$CARGO_HOME/env"
          fi
          printf '%s\n' "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Workspace tests
        shell: sh
        run: |
          ulimit -n 4096 2>/dev/null || true
          RUST_TEST_THREADS=2 cargo test --workspace --exclude dwaar-cli

      - name: CLI tests
        shell: sh
        run: cargo test -p dwaar-cli --bins --test cli_integration

      - name: Ignored tests
        shell: sh
        run: cargo test --workspace --exclude dwaar-cli -- --ignored --nocapture

  rust-build:
    name: permanu-ci / dwaar / rust-build-release
    needs: version-guard
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'main' || inputs.lane == 'release' || inputs.lane == 'all')) }}
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Setup Rust
        shell: sh
        run: |
          export HOME="$PWD/.permanu-home"
          export CARGO_HOME="$PWD/.permanu-cargo"
          export RUSTUP_HOME="$PWD/.permanu-rustup"
          export PATH="$CARGO_HOME/bin:$PATH"
          mkdir -p "$HOME" "$CARGO_HOME" "$RUSTUP_HOME"
          lock=/tmp/permanu-rustup.lock
          waited=0
          while ! mkdir "$lock" 2>/dev/null; do
            if find "$lock" -maxdepth 0 -mmin +10 >/dev/null 2>&1; then
              rm -rf "$lock"
              continue
            fi
            waited=$((waited + 2))
            if [ "$waited" -gt 300 ]; then
              echo "timed out waiting for rustup lock"
              exit 1
            fi
            sleep 2
          done
          trap 'rm -rf "$lock"' EXIT
          if ! command -v cmake >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake pkg-config protobuf-compiler
          fi
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          if [ -f "$CARGO_HOME/env" ]; then
            . "$CARGO_HOME/env"
          fi
          printf '%s\n' "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Build workspace
        shell: sh
        run: cargo build --workspace

      - name: Release type check
        shell: sh
        run: cargo check --workspace --release

      - name: Install cosign for release signing
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Build and sign production release assets
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: sh
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          PERMANU_COSIGN_KEY: ${{ secrets.PERMANU_COSIGN_KEY }}
          DWAAR_COSIGN_PUBKEY: ${{ secrets.DWAAR_COSIGN_PUBKEY }}
          PERMANU_COSIGN_VERIFY_KEY: ${{ secrets.PERMANU_COSIGN_VERIFY_KEY }}
          COSIGN_VERIFY_KEY: ${{ secrets.COSIGN_VERIFY_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          SIGSTORE_ID_TOKEN: ${{ secrets.SIGSTORE_ID_TOKEN }}
          PERMANU_SIGSTORE_ID_TOKEN: ${{ secrets.PERMANU_SIGSTORE_ID_TOKEN }}
        run: |
          export HOME="$PWD/.permanu-home"
          export CARGO_HOME="$PWD/.permanu-cargo"
          export RUSTUP_HOME="$PWD/.permanu-rustup"
          export PATH="$CARGO_HOME/bin:$PATH"
          mkdir -p "$HOME" "$CARGO_HOME" "$RUSTUP_HOME"
          if [ -f "$CARGO_HOME/env" ]; then
            . "$CARGO_HOME/env"
          fi
          chmod +x scripts/build-release-assets.sh
          ./scripts/build-release-assets.sh dist

      - name: Verify production release assets
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: sh
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          PERMANU_COSIGN_KEY: ${{ secrets.PERMANU_COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          SIGSTORE_ID_TOKEN: ${{ secrets.SIGSTORE_ID_TOKEN }}
          PERMANU_SIGSTORE_ID_TOKEN: ${{ secrets.PERMANU_SIGSTORE_ID_TOKEN }}
        run: |
          chmod +x scripts/validate-release-assets.sh
          ./scripts/validate-release-assets.sh dist

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          chmod +x scripts/publish-github-release-assets.sh
          ./scripts/publish-github-release-assets.sh dist
