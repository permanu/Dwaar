name: Permanu CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      lane:
        description: Explicit CI lane to run manually.
        required: true
        type: choice
        default: pr
        options:
          - pr
          - main
          - release
          - all

permissions:
  contents: write
  checks: write
  statuses: write
  pull-requests: read
  id-token: write

concurrency:
  group: dwaar-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-guard:
    name: permanu-ci / dwaar / version-guard
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'pr' || inputs.lane == 'main' || inputs.lane == 'release' || inputs.lane == 'all')) }}
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Check release version consistency
        shell: sh
        run: |
          chmod +x scripts/check-version-consistency.sh
          ./scripts/check-version-consistency.sh

  rust-quality:
    name: permanu-ci / dwaar / rust-quality
    needs: version-guard
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'pr' || inputs.lane == 'main' || inputs.lane == 'release' || inputs.lane == 'all')) }}
    runs-on: self-hosted
    container:
      image: rust:1.94.1-bookworm
      env:
        CARGO_HOME: /usr/local/cargo
        RUSTUP_HOME: /usr/local/rustup
        TMPDIR: /tmp
        TMP: /tmp
        TEMP: /tmp
        PATH: /usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    timeout-minutes: 30
    steps:
      - name: Format and lint
        shell: sh
        run: |
          chmod +x scripts/permanu-ci-rust-env.sh
          PERMANU_RUST_MODE=quality
          export PERMANU_RUST_MODE
          . ./scripts/permanu-ci-rust-env.sh
          unset PERMANU_RUST_MODE
          if ! command -v cmake >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake pkg-config protobuf-compiler
          fi
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings

  rust-test:
    name: permanu-ci / dwaar / rust-test
    needs: rust-quality
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'pr' || inputs.lane == 'main' || inputs.lane == 'release' || inputs.lane == 'all')) }}
    runs-on: self-hosted
    container:
      image: rust:1.94.1-bookworm
      env:
        CARGO_HOME: /usr/local/cargo
        RUSTUP_HOME: /usr/local/rustup
        TMPDIR: /tmp
        TMP: /tmp
        TEMP: /tmp
        PATH: /usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    timeout-minutes: 45
    steps:
      - name: Workspace and CLI tests
        shell: sh
        run: |
          chmod +x scripts/permanu-ci-rust-env.sh
          PERMANU_RUST_MODE=cargo
          export PERMANU_RUST_MODE
          . ./scripts/permanu-ci-rust-env.sh
          unset PERMANU_RUST_MODE
          if ! command -v cmake >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake pkg-config protobuf-compiler
          fi
          ulimit -n 4096 2>/dev/null || true
          RUST_TEST_THREADS=2 cargo test --workspace --exclude dwaar-cli
          cargo test -p dwaar-cli --bins --test cli_integration
          cargo test --workspace --exclude dwaar-cli -- --ignored --nocapture

  dependency-audit:
    name: permanu-ci / dwaar / dependency-audit
    needs: rust-test
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'pr' || inputs.lane == 'main' || inputs.lane == 'release' || inputs.lane == 'all')) }}
    runs-on: self-hosted
    container:
      image: rust:1.94.1-bookworm
      env:
        CARGO_HOME: /usr/local/cargo
        RUSTUP_HOME: /usr/local/rustup
        TMPDIR: /tmp
        TMP: /tmp
        TEMP: /tmp
        PATH: /usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    timeout-minutes: 30
    steps:
      - name: Run dependency audit
        shell: sh
        run: |
          chmod +x scripts/permanu-ci-rust-env.sh
          PERMANU_RUST_MODE=audit
          export PERMANU_RUST_MODE
          . ./scripts/permanu-ci-rust-env.sh
          unset PERMANU_RUST_MODE
          cargo audit \
            --ignore RUSTSEC-2025-0069 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0114 \
            --ignore RUSTSEC-2024-0388 \
            --ignore RUSTSEC-2024-0384 \
            --ignore RUSTSEC-2024-0437 \
            --ignore RUSTSEC-2025-0134 \
            --ignore RUSTSEC-2025-0012 \
            --ignore RUSTSEC-2026-0097

  rust-build:
    name: permanu-ci / dwaar / rust-build-release
    needs: dependency-audit
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'main' || inputs.lane == 'release' || inputs.lane == 'all')) }}
    runs-on: self-hosted
    container:
      image: rust:1.94.1-bookworm
      env:
        CARGO_HOME: /usr/local/cargo
        RUSTUP_HOME: /usr/local/rustup
        TMPDIR: /tmp
        TMP: /tmp
        TEMP: /tmp
        PATH: /usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    timeout-minutes: 30
    steps:
      - name: Build workspace
        shell: sh
        run: |
          chmod +x scripts/permanu-ci-rust-env.sh
          PERMANU_RUST_MODE=release
          export PERMANU_RUST_MODE
          . ./scripts/permanu-ci-rust-env.sh
          unset PERMANU_RUST_MODE
          if ! command -v cmake >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake pkg-config protobuf-compiler
          fi
          cargo build --workspace
          cargo check --workspace --release

      - name: Install cosign for release signing
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Build and sign production release assets
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: sh
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          PERMANU_COSIGN_KEY: ${{ secrets.PERMANU_COSIGN_KEY }}
          DWAAR_COSIGN_PUBKEY: ${{ secrets.DWAAR_COSIGN_PUBKEY }}
          PERMANU_COSIGN_VERIFY_KEY: ${{ secrets.PERMANU_COSIGN_VERIFY_KEY }}
          COSIGN_VERIFY_KEY: ${{ secrets.COSIGN_VERIFY_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          SIGSTORE_ID_TOKEN: ${{ secrets.SIGSTORE_ID_TOKEN }}
          PERMANU_SIGSTORE_ID_TOKEN: ${{ secrets.PERMANU_SIGSTORE_ID_TOKEN }}
        run: |
          chmod +x scripts/permanu-ci-rust-env.sh scripts/build-release-assets.sh
          PERMANU_RUST_MODE=release
          export PERMANU_RUST_MODE
          . ./scripts/permanu-ci-rust-env.sh
          unset PERMANU_RUST_MODE
          if ! command -v cmake >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake pkg-config protobuf-compiler
          fi
          ./scripts/build-release-assets.sh dist

      - name: Verify production release assets
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: sh
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          PERMANU_COSIGN_KEY: ${{ secrets.PERMANU_COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          SIGSTORE_ID_TOKEN: ${{ secrets.SIGSTORE_ID_TOKEN }}
          PERMANU_SIGSTORE_ID_TOKEN: ${{ secrets.PERMANU_SIGSTORE_ID_TOKEN }}
        run: |
          chmod +x scripts/validate-release-assets.sh
          ./scripts/validate-release-assets.sh dist

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          chmod +x scripts/publish-github-release-assets.sh
          ./scripts/publish-github-release-assets.sh dist
